name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/goals-pane.png'
      - 'docs/needs-you-sell-gear.jpg'
      - 'docs/quarterdeck-icon.svg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # The images live in docs/ for the README; copy them in rather than keep two copies.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp docs/goals-pane.png docs/needs-you-sell-gear.jpg docs/quarterdeck-icon.svg _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
      - id: deployment
        uses: actions/deploy-pages@v4
